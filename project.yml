name: DualCam
options:
  bundleIdPrefix: com.rodrigue
  deploymentTarget:
    iOS: "17.0"
targets:
  DualCam:
    type: application
    platform: iOS
    sources: [DualCam]
    scheme: {}
    info:
      path: DualCam/Info.plist
      properties:
        CFBundleDisplayName: DualCam
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        NSCameraUsageDescription: DualCam filme en horizontal et en vertical en même temps.
        NSMicrophoneUsageDescription: DualCam enregistre le son avec la vidéo.
        NSPhotoLibraryAddUsageDescription: DualCam enregistre tes vidéos dans Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodrigue.dualcam
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
